<!DOCTYPE html>
<html>
<head>
    <title>Menu DOM Operations</title>
</head>
<body>
    <h1 id="text">Welcome to DOM Operations</h1>
    <button onclick="changeColor()">Change Color</button>
    <button onclick="increaseFont()">Increase Font Size</button>
    <button onclick="hideElement()">Hide Element</button>
    <button onclick="exitMenu()">Exit</button>
    <script>
        function changeColor() {
            document.getElementById("text").style.color = "red";
        }
        function increaseFont() {
            document.getElementById("text").style.fontSize = "40px";
        }
        function hideElement() {
            document.getElementById("text").style.display = "none";
        }
        function exitMenu() {
            alert("Program Exited");
        }
    </script>
</body>
</html>
